---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  IngressClassName: nginx
  rules:
    - host: bankapp.local
      http:
        paths:
          -path: /
           pathType: Prefix
           backend:
             service:
               name: my-service
               port:
                 number: 80
                 